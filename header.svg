<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->

  <linearGradient id="background" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="45%" stop-color="#0A1026"/>
    <stop offset="100%" stop-color="#190A2E"/>
  </linearGradient>

  <!-- Neon -->

  <linearGradient id="neonGradient" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset="0.45" stop-color="#6366F1"/>
    <stop offset="1" stop-color="#FF2DAA"/>
  </linearGradient>

  <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>

  <!-- Blue glow -->

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
  </radialGradient>

  <!-- Pink glow -->

  <radialGradient id="pinkGlow">
    <stop offset="0%" stop-color="#FF2DAA" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#FF2DAA" stop-opacity="0"/>
  </radialGradient>

  <!-- Grid -->

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#6070A0" stroke-opacity="0.09"/>
  </pattern>

  <!-- Glow -->

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

</defs>

